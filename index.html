<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070F1F">
  <title>Organizador</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="app"><p style="padding:24px">Carregando…</p></div>
  <script>
    // Se algum arquivo faltar, mostra o erro em vez de "Carregando…" para sempre
    function falhaCarga(msg) {
      var el = document.getElementById('app');
      if (el && !document.querySelector('.casca')) el.innerHTML = '<div style="padding:24px;font-family:system-ui;max-width:560px">' +
        '<h2>Não foi possível abrir o app</h2><p>' + msg + '</p><p>Confira se as pastas <b>css, js, lib e icones</b> estão no GitHub e recarregue.</p></div>';
    }
    window.addEventListener('error', function (e) { if (e.target && e.target.src) falhaCarga('Arquivo não encontrado: ' + e.target.src); else falhaCarga(e.message || 'Erro desconhecido'); }, true);
    window.addEventListener('unhandledrejection', function (e) { falhaCarga(String(e.reason && e.reason.message || e.reason)); });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
